name: CI

on:
  push:
    branches: [main]
  # Every pull request, so stacked PRs (targeting another feature branch) are verified too.
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Betsi.slnx

      - name: Build
        # Warnings are errors (see Directory.Build.props), which covers the package-hygiene
        # rules NU1608/NU1902/NU1903 as well as compiler warnings.
        run: dotnet build Betsi.slnx --configuration Release --no-restore

      - name: Test
        # The SQL Server suite uses Testcontainers; the GitHub runner has a Docker daemon,
        # so it runs here even though it skips on a workstation without one.
        run: >
          dotnet test Betsi.slnx --configuration Release --no-build
          --coverage --coverage-output-format cobertura
          --coverage-output "${{ github.workspace }}/TestResults/full.cobertura.xml"

      - name: Coverage gate (Domain and Application ≥70%)
        # Phase C's exit criterion. The gate covers the two layers that hold the clinical
        # state machines and the command pipeline; API and Infrastructure are exercised by
        # the integration and SQL Server suites but are not gated on a percentage.
        run: python3 tools/coverage-gate.py TestResults/full.cobertura.xml --threshold 70

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: TestResults/full.cobertura.xml
          if-no-files-found: warn

  browser:
    name: Browser boards and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify bundled SignalR client matches the lockfile
        run: |
          npm run vendor:signalr
          git diff --exit-code -- Betsi/wwwroot/lib/signalr
      - name: Start development identity provider and SQL Server
        run: docker compose up -d --wait --wait-timeout 180 sqlserver keycloak
      - run: dotnet build Betsi.slnx
      - name: Test actual browser login, boards, recovery and axe
        run: npm run test:ui
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            TestResults/browser
            TestResults/browser-report
          if-no-files-found: warn
      - name: Dependency logs
        if: failure()
        run: docker compose logs --tail 100 sqlserver keycloak
      - name: Stop dependencies
        if: always()
        run: docker compose down

  schema-drift:
    name: Migrations match the model
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore
        # dotnet-ef builds the project to read the model, which needs restored packages.
        run: dotnet restore Betsi/Betsi.csproj

      - name: Check for un-migrated model changes
        # The first migration in this repository was hand-written and had already drifted
        # from the model. This makes that impossible to repeat, for the tenant schema and the
        # control-plane schema alike.
        run: |
          dotnet dotnet-ef migrations has-pending-model-changes --project Betsi/Betsi.csproj --context BetsiDbContext
          dotnet dotnet-ef migrations has-pending-model-changes --project Betsi/Betsi.csproj --context ControlPlaneDbContext

  vulnerable-packages:
    name: No vulnerable or deprecated packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Betsi.slnx

      - name: Fail on vulnerable packages
        run: |
          set -o pipefail
          output=$(dotnet list Betsi.slnx package --vulnerable --include-transitive)
          echo "$output"
          if echo "$output" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable packages detected."
            exit 1
          fi

      - name: Report deprecated packages
        continue-on-error: true
        run: dotnet list Betsi.slnx package --deprecated
